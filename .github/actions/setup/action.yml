name: Setup
description: Install Bun, then Node and the dependencies unless only docs changed.

outputs:
  docs-only:
    description: "'true' when every file changed since the base is docs."
    value: ${{ steps.changes.outputs.docs-only }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # The packageManager field pins Bun.
        bun-version-file: package.json

    # Pull requests compare with their base branch, pushes with the commit
    # before them. Anything else, or a base git can't find, runs everything.
    - id: changes
      shell: bash
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || '' }}
      run: |
        docs_only=$(bun scripts/docs-only.ts "$BASE")
        echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

    - if: steps.changes.outputs.docs-only != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - if: steps.changes.outputs.docs-only != 'true'
      shell: bash
      run: bun install --frozen-lockfile
