name: Idea
description: A feature or a change to how something works
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were building and where the library got in the way. Code helps.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The API you wish you could write. Rough is fine.
      render: tsx
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: Your workaround, if you have one.
